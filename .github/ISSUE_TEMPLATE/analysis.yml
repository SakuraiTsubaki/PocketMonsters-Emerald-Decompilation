name: Target analysis
description: Document or improve a finding for Pocket Monsters Emerald.
title: "[Analysis] "
body:
  - type: input
    id: subject
    attributes:
      label: Subject
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: Exact target identity and applicability
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence, method, and verification
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Retained non-ROM artifacts
      description: Reports, logs, manifests, structured data, patches, images, and PNG results.
    validations:
      required: true
  - type: dropdown
    id: confidence
    attributes:
      label: Confidence
      options:
        - Confirmed
        - Probable
        - Hypothesis
    validations:
      required: true
