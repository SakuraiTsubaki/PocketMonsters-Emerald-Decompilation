name: Target tool
description: Add or improve tooling specific to Pocket Monsters Emerald.
title: "[Tool] "
body:
  - type: input
    id: purpose
    attributes:
      label: Purpose
    validations:
      required: true
  - type: textarea
    id: interface
    attributes:
      label: Supported builds, inputs, and outputs
    validations:
      required: true
  - type: textarea
    id: retained
    attributes:
      label: Retained outputs
      description: Source, configuration, fixtures, manifests, logs, examples, images, PNG previews, and tests.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Tests and acceptance criteria
    validations:
      required: true
