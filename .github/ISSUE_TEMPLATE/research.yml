name: Target research
description: Investigate a focused question for Pocket Monsters Emerald.
title: "[Research] "
body:
  - type: input
    id: question
    attributes:
      label: Research question
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: Exact target identity
      description: Release, region, revision, ROM hashes, and tool versions.
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: Method and evidence
      description: Inputs, provenance, commands, observations, and constraints.
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Non-ROM artifacts to retain
      description: Logs, manifests, tables, structured data, patches, images, PNG outputs, and verification material.
    validations:
      required: true
